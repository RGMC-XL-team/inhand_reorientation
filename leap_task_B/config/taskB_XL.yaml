tolerance:
  xy: 0.005 # the tolerance for xy in meter (default: 0.02)
  yaw: 0.2 # the tolerance for yaw in rad  (default: 0.25[rad] or 15[deg])

time_budget: 10000.0 # the time budget for the task (default: 30.0)
face_sequence_length: 10 # the face sequence length for the task (default: 10)

control:
  action_scale: 0.04167 # action scale for rl policy (default: 1/24)
  smooth_move_time: 0.5 # time for hand to move from A to B smoothly (default: 0.8)
  rl_cube_length: 0.05 # the imagined cube length for rl policy
  model_based_cube_length: 0.025 # the imagined cube length for model-based policy
  flip_fingertip_radius: 0.015 # enable loose grasp for flipping
  rot_fingertip_radius: 0.01 # enable hard grasp for rotating
  enable_stop_after_every_flip: False # enable stop after every flip
  control_stop_duration: 1.0 # the duration for stopping after every flip
  flip_stop_detect_threshold: 0.01 # the threshold for detecting stop after flip

reset_options:
  forced_reset: False # forced reset before rot and flip (default: False)
  max_reset_times: 1 # max reset times before rot and flip (default: 2)

anomaly_detection:
  period: 0.2 # the period for anomaly detection (default: 0.2)
  rot_tilt_angle_thresh: 0.5 # the tilt angle threshold for rot anomaly detection (default: 0.5)
  flip_x_lower_bound: -0.05 # the minimum object center x for flipping
  flip_y_upper_bound: 0.05 # the maximum object center y for flipping
  max_rot_time: 8.0 # the maximum time for rotating (default: 8.0)
  max_flip_time: 10.0 # the maximum time for flipping (default: 10.0)
  max_wait_time: 2.0 # the maximum time for waiting (default: 2.0)

# object_center_pos: [-0.0592509, 0.02004605, 0.08418902] # the object center position in the world frame (default: [-0.0592509, 0.03504605, 0.08918902])
object_center_pos: [-0.055, 0.02504605, 0.08418902]

