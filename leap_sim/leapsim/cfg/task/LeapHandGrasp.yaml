name: LeapHandGrasp

defaults:
  - LeapHandRot

env:
  controller:
    controlFrequencyInv: 8

  episodeLength: 50
  genGrasps: True

  disable_actions: True

  randomGraspMethod: "flip_small_noise" # "euler_angle", "euler_angle_for_flip", "original" or "rot_free_yaw"
  # fix_reset_quat: False            # fix reset object quaternion as [0, 0, 0, 1]

  randomization:
    randomizeMass: True
    randomizeMassLower: 0.05
    randomizeMassUpper: 0.051
    randomizeCOM: False
    randomizeFriction: False
    randomizeScale: False
    randomizePDGains: False

  random_xy_bias_limit: 0.01 # default: 0.01
  finger_dist_threshold: 0.07 # default: 0.06
  fingertip_dist_min: 0.025 # default: 0.03
  finger_near_obj_min_num: 4 # default: 3
  grasp_dof_search_radius: 0.4 # default: 0.4
  finger_above_obj_center_z: [-0.015, 0.045] # default: [-0.01, 0.035]

  force_high_finger2: True # default: False

