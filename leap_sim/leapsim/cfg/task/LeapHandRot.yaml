# used to create the object
name: LeapHandRot
physics_engine: ${..physics_engine}
on_evaluation: False

# IsaacGymEnvs style domain randomization
randomize: False # default: True
randomization_params:
  frequency: 600 # default: 1200
  observations:
    range: [0, .002]
    range_correlated: [0, .001]
    operation: "additive"
    distribution: "gaussian"
  actions:
    range: [0., .05]
    range_correlated: [0, .015]
    operation: "additive"
    distribution: "gaussian"
  sim_params:
    gravity:
      range: [0, 0.4]
      operation: "additive"
      distribution: "gaussian"
  actor_params:
    hand:
      # color: True
      # dof_properties:
      #   damping:
      #     range: [0.8, 1.2]
      #     operation: "scaling"
      #     distribution: "uniform"
      #   stiffness:
      #     range: [0.8, 1.2]
      #     operation: "scaling"
      #     distribution: "uniform"
      # rigid_body_properties:
      #   mass:
      #     range: [0.8, 1.2]
      #     operation: "scaling"
      #     distribution: "uniform"
      #     setup_only: True
      rigid_shape_properties:
        # friction:
        #   num_buckets: 100
        #   range: [0.3, 2.0]
        #   operation: "scaling"
        #   distribution: "uniform"
        #   same_for_all: True
        restitution:
          num_buckets: 100
          range: [0.0, 2]
          operation: "scaling"
          distribution: "uniform"
    object:
      # scale:
      #   range: [ 0.95, 1.05 ]
      #   operation: "scaling"
      #   distribution: "uniform"
      #   setup_only: True
      # rigid_body_properties:
      #   mass:
      #     range: [0.3, 1.8]
      #     operation: "scaling"
      #     distribution: "uniform"
      #     setup_only: True
      rigid_shape_properties:
        # friction:
        #   num_buckets: 100
        #   range: [0.3, 2.0]
        #   operation: "scaling"
        #   distribution: "uniform"
        #   same_for_all: True
        restitution:
          num_buckets: 100
          range: [0.0, 2]
          operation: "scaling"
          distribution: "uniform"

env:
  # environment basic
  numEnvs: ${resolve_default:8192,${...num_envs}}
  numObservations: 102
  numActions: 16
  envSpacing: 0.25
  phase_period: 2
  exec_lag: 1
  include_obj_pose: false # default: true

  # goal condition
  goal_conditioned: False

  episodeLength: 100
  # warmStartLength: 50
  enableDebugVis: False
  aggregateMode: 1

  controller:
    torque_control: False
    controlFrequencyInv: 6 # 20Hz
    pgain: 3
    dgain: 0.1
    effortLimit: 0.5 # default: 0.95 (0.5 in code)

  genGrasps: False

  clipObservations: 5.0
  clipActions: 1.0
  reset_height_threshold: 0.4
  grasp_cache_name: "custom_grasp_cache_v2high" # This must be supplied via command line
  grasp_cache_len: 1024

  # Random forces applied to the object
  forceScale: 10.0
  randomForceProbScalar: 0.25
  forceDecay: 0.9
  forceDecayInterval: 0.08

  rew_scale: 1.0
  rotate_direction: "ccw" # "cw" or "ccw"
  disabled_fingers: [] # disabled fingers

  reward:
    angvelClipMin: -0.25
    angvelClipMax: 0.25
    rotateRewardScale: 0.0
    objLinvelPenaltyScale: -0.3
    poseDiffPenaltyScale: -0.1
    torquePenaltyScale: -0.1
    workPenaltyScale: -1.0

    resetWarmStartLength: 30
    resetWhenTilted: False
    resetRollPitchThresh: 0.2 # (~6deg)

    successTolerancePos: 0.03
    fallDistance: 0.24

  additional_rewards:
    rotate_finite_diff: 1.25 # 1.25
    object_pos_diff: 0.0 # -0.5
    object_fallen: -20 # default: -10

  override_object_init_z: 0.59 # default: 0.60
  override_object_init_x: -0.05 # default: -0.05
  override_object_init_y: 0.04 # default: 0.04

  canonical_pose:
    - 0.1458
    - -1.0470
    - 1.7247
    - -0.2187
    - 1.2985
    - 1.6139
    - 0.9757
    - 1.0728
    - -0.1054
    - 0.0290
    - 1.6039
    - 0.1227
    - -0.1084
    - 0.9652
    - 1.7317
    - 0.1071

  num_contact_fingers: 0
  baseObjScale: 0.8

  randomization:
    # Randomization Property
    randomizeMass: True
    randomizeMassLower: 0.01 # default: 0.01
    randomizeMassUpper: 0.09 # default: 0.25
    randomizeCOM: True
    randomizeCOMLower: -0.01
    randomizeCOMUpper: 0.01
    randomizeFriction: True
    randomizeFrictionLower: 0.1 # default: 0.3
    randomizeFrictionUpper: 0.6 # default: 1.0
    randomizeSiliconFrictionLower: 0.8 # default: 0.8
    randomizeSiliconFrictionUpper: 2.0 # default: 3.0
    randomizeScale: True
    # if scale_list_init is True, randomizeScaleLower and randomizeScaleUpper is not useful
    scaleListInit: True
    randomizeScaleList: [0.95, 0.9, 1.0, 1.05, 1.1]
    randomizeScaleLower: 0.75 # only useful when not scaleListInit
    randomizeScaleUpper: 0.8 # only useful when not scaleListInit
    randomizePDGains: True
    randomizePGainLower: 2.9
    randomizePGainUpper: 3.1
    randomizeDGainLower: 0.09
    randomizeDGainUpper: 0.11
    # # observation noise
    # obj_pose:
    #   pos_random_scale: 0.005
    #   quat_random_scale: 0.05
    #   pos_outlier_scale: 0.015
    #   prob_outlier: 0.05
    #   lpf_smooth_factor: 0.25   # 0.0: no update, 1.0: no smooth

  privInfo:
    enableObjPos: True
    enableObjScale: True
    enableObjMass: True
    enableObjCOM: True
    enableObjFriction: True

  object:
    type: "cube_50mm" # can be block, egg or pen
    sampleProb: [1.0]

  sim_to_real_indices: [1, 0, 2, 3, 9, 8, 10, 11, 13, 12, 14, 15, 4, 5, 6, 7]
  real_to_sim_indices: [1, 0, 2, 3, 12, 13, 14, 15, 5, 4, 6, 7, 9, 8, 10, 11]

  asset:
    handAsset: "assets/leap_hand/leaphand_high_palm.urdf"
    # handAsset: 'assets/leap_hand/robot.urdf'
    # handAsset: 'assets/leap/leap.urdf'
    # handAsset: 'assets/leap_hand/wider_hand_export/robot.urdf'
    # handAsset: 'assets/leap_hand/wider_hand_export/robot_modified.urdf'
    ftipRbLinkNames:
      - "fingertip_new_tip"
      - "thumb_fingertip_new_tip"
      - "fingertip_2_new_tip"
      - "fingertip_3_new_tip"
    fingertip_names:
      - "fingertip_new"
      - "thumb_fingertip_new"
      - "fingertip_2_new"
      - "fingertip_3_new"

  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

sim:
  dt: 0.0083333 # 120 Hz
  substeps: 1
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},'gpu'}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:'cuda',${....sim_device}} # set to False to run on CPU
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 2 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (default - all contacts)
